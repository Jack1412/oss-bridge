# 项目配置文件示例（传给 --config）
# 命令行参数与环境变量优先级高于本文件。

[oss_bridge]
endpoint = "oss-cn-hangzhou-internal.aliyuncs.com"
bucket = "your-bucket"
prefix = "oss-bridge/"

# 1 = 不校验指令签名；0/删除 = 开启（此时必须配置 secret 或 --secret-file）
require_signature = false

# 轮询与执行参数（都有合理默认值，通常不用改）
poll_interval_idle = 2.0
poll_interval_active = 0.3
full_sweep_interval = 30.0
heartbeat_interval = 15.0
lease_grace_s = 120.0
max_attempts = 3
concurrency = 2
max_output_bytes = 65536
